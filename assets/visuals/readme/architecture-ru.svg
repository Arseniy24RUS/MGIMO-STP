<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-labelledby="title desc">
  <title id="title">Статическая архитектура публикации MGIMO-STP</title>
  <desc id="desc">Схема показывает путь от двуязычного контента и бренд-активов к статическим страницам, runtime-переключателям, форме сотрудничества и публикации GitHub Pages.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#5bd0d3"/>
    </marker>
    <style>
      .bg{fill:#071633}
      .panel{fill:#0c2147;stroke:#24508f;stroke-width:2}
      .panel-bright{fill:#12316a;stroke:#5bd0d3;stroke-width:2}
      .panel-note{fill:#071f3b;stroke:#8aa6d6;stroke-width:2}
      .title{font:700 32px Arial,sans-serif;fill:#fff}
      .subtitle{font:400 22px Arial,sans-serif;fill:#bfd0f3}
      .kicker{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#5bd0d3}
      .heading{font:700 25px Arial,sans-serif;fill:#fff}
      .body{font:400 22px Arial,sans-serif;fill:#e6eefc}
      .small{font:400 22px Arial,sans-serif;fill:#bfd0f3}
      .arrow{stroke:#5bd0d3;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1040" height="660"/>
  <text class="title" x="40" y="56">Статическая архитектура публикации MGIMO-STP</text>
  <text class="subtitle" x="40" y="90">Двуязычная витрина, бренд-активы, страницы проектов и обращения о сотрудничестве</text>

  <rect class="panel" x="40" y="130" width="285" height="165" rx="8"/>
  <text class="kicker" x="64" y="162">МОДЕЛЬ КОНТЕНТА</text>
  <text class="heading" x="64" y="196">RU / EN словарь</text>
  <text class="body" x="64" y="230">Тексты главной,</text>
  <text class="body" x="64" y="258">проекты, источники,</text>
  <text class="body" x="64" y="286">команды и партнёры</text>

  <rect class="panel" x="377" y="130" width="285" height="165" rx="8"/>
  <text class="kicker" x="401" y="162">БРЕНД-ПАКЕТ</text>
  <text class="heading" x="401" y="196">Локальные активы</text>
  <text class="body" x="401" y="230">Логотипы МГИМО,</text>
  <text class="body" x="401" y="258">Приоритет, Минобрнауки,</text>
  <text class="body" x="401" y="286">hero и обложки проектов</text>

  <rect class="panel-bright" x="714" y="130" width="285" height="165" rx="8"/>
  <text class="kicker" x="738" y="162">СТАТИЧЕСКИЙ САЙТ</text>
  <text class="heading" x="738" y="196">Без сборки</text>
  <text class="body" x="738" y="230">index.html, страницы</text>
  <text class="body" x="738" y="258">проектов, согласие,</text>
  <text class="body" x="738" y="286">CSS и обычный JS</text>

  <path class="arrow" d="M327 213 H362"/>
  <path class="arrow" d="M664 213 H699"/>

  <rect class="panel-bright" x="135" y="380" width="325" height="180" rx="8"/>
  <text class="kicker" x="159" y="412">ОПЫТ ПОЛЬЗОВАТЕЛЯ</text>
  <text class="heading" x="159" y="446">От витрины к проекту</text>
  <text class="body" x="159" y="480">Язык и тема хранятся</text>
  <text class="body" x="159" y="508">в localStorage; карточки</text>
  <text class="body" x="159" y="536">открывают страницы СТП.</text>

  <rect class="panel-note" x="580" y="380" width="325" height="180" rx="8"/>
  <text class="kicker" x="604" y="412">СОТРУДНИЧЕСТВО</text>
  <text class="heading" x="604" y="446">Форма без сервера</text>
  <text class="body" x="604" y="476">Проверка на клиенте,</text>
  <text class="body" x="604" y="502">FormSubmit и mailto;</text>
  <text class="body" x="604" y="528">доставка ожидает</text>
  <text class="body" x="604" y="554">активации.</text>

  <path class="arrow" d="M856 298 V345 H298 V370"/>
  <path class="arrow" d="M462 470 H565"/>
  <text class="small" x="299" y="622">Публикация из корня репозитория через GitHub Pages</text>
</svg>
